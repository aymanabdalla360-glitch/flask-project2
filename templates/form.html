<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <!-- جعل الصفحة مناسبة للهاتف -->
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        إضافة طالب
    </title>


    <!-- ==========================================
         ربط ملف CSS
         ========================================== -->

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>


<body>


    <!-- ==========================================
         عنوان الصفحة
         ========================================== -->

    <h1>
        إضافة طالب جديد
    </h1>


    <!-- ==========================================
         رسالة الخطأ
         تظهر إذا كانت هناك مشكلة في البيانات
         ========================================== -->

    {% if error %}

        <p class="error-message">
            {{ error }}
        </p>

    {% endif %}


    <!-- ==========================================
         نموذج إضافة الطالب
         ========================================== -->

    <form
        action="/submit"
        method="POST"
        class="student-form"
    >


        <!-- ==========================================
             اسم الطالب
             ========================================== -->

        <label for="name">
            اسم الطالب
        </label>

        <input
            type="text"
            id="name"
            name="name"
            placeholder="أدخل اسم الطالب"
            required
        >


        <!-- ==========================================
             الفصل
             ========================================== -->

        <label for="class_name">
            الفصل
        </label>

        <select
            id="class_name"
            name="class_name"
            required
        >

            <option value="">
                اختر الفصل
            </option>

            <option value="1-1">
                1-1
            </option>

            <option value="1-2">
                1-2
            </option>

            <option value="1-3">
                1-3
            </option>

        </select>


        <!-- ==========================================
             التخصص
             ========================================== -->

        <label for="specialization">
            التخصص
        </label>

        <input
            type="text"
            id="specialization"
            name="specialization"
            placeholder="أدخل تخصص الطالب"
            required
        >


        <!-- ==========================================
             التليفون
             ========================================== -->

        <label for="phone">
            التليفون
        </label>

        <input
            type="tel"
            id="phone"
            name="phone"
            placeholder="أدخل رقم التليفون"
            required
        >


        <!-- ==========================================
             العنوان
             ========================================== -->

        <label for="address">
            العنوان
        </label>

        <input
            type="text"
            id="address"
            name="address"
            placeholder="أدخل عنوان الطالب"
            required
        >


        <!-- ==========================================
             زر إضافة الطالب
             ========================================== -->

        <button type="submit">
            ➕ إضافة الطالب
        </button>

    </form>


    <!-- ==========================================
         العودة إلى الصفحة الرئيسية
         ========================================== -->

    <div class="page-links">

        <a
            href="/"
            class="back-btn"
        >
            🏠 الصفحة الرئيسية
        </a>


        <!-- العودة إلى قائمة الطلاب -->

        <a
            href="/students"
            class="add-btn"
        >
            📋 قائمة الطلاب
        </a>

    </div>


</body>

</html>
