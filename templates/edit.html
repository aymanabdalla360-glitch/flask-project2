<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <!-- جعل الصفحة مناسبة للهاتف -->
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        تعديل بيانات الطالب
    </title>


    <!-- ==========================================
         ربط ملف CSS
         ========================================== -->

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>


<body>


    <!-- ==========================================
         عنوان الصفحة
         ========================================== -->

    <h1>
        تعديل بيانات الطالب
    </h1>


    <!-- ==========================================
         رسالة الخطأ
         ========================================== -->

    {% if error %}

        <p class="error-message">
            {{ error }}
        </p>

    {% endif %}


    <!-- ==========================================
         نموذج تعديل بيانات الطالب
         ========================================== -->

    <form
        action="/update/{{ student.0 }}"
        method="POST"
        class="student-form"
    >


        <!-- ==========================================
             اسم الطالب
             ========================================== -->

        <label for="name">
            اسم الطالب
        </label>

        <input
            type="text"
            id="name"
            name="name"
            value="{{ student.1 }}"
            required
        >


        <!-- ==========================================
             الفصل
             ========================================== -->

        <label for="class_name">
            الفصل
        </label>

        <select
            id="class_name"
            name="class_name"
            required
        >

            <option value="1-1"
                {% if student.2 == "1-1" %}selected{% endif %}>
                1-1
            </option>

            <option value="1-2"
                {% if student.2 == "1-2" %}selected{% endif %}>
                1-2
            </option>

            <option value="1-3"
                {% if student.2 == "1-3" %}selected{% endif %}>
                1-3
            </option>

        </select>


        <!-- ==========================================
             التخصص
             ========================================== -->

        <label for="specialization">
            التخصص
        </label>

        <input
            type="text"
            id="specialization"
            name="specialization"
            value="{{ student.3 }}"
            required
        >


        <!-- ==========================================
             التليفون
             ========================================== -->

        <label for="phone">
            التليفون
        </label>

        <input
            type="tel"
            id="phone"
            name="phone"
            value="{{ student.4 }}"
            required
        >


        <!-- ==========================================
             العنوان
             ========================================== -->

        <label for="address">
            العنوان
        </label>

        <input
            type="text"
            id="address"
            name="address"
            value="{{ student.5 }}"
            required
        >


        <!-- ==========================================
             زر حفظ التعديل
             ========================================== -->

        <button type="submit">
            💾 حفظ التعديل
        </button>

    </form>


    <!-- ==========================================
         روابط التنقل
         ========================================== -->

    <div class="page-links">

        <!-- العودة إلى قائمة الطلاب -->

        <a
            href="/students"
            class="back-btn"
        >
            📋 قائمة الطلاب
        </a>


        <!-- العودة إلى الصفحة الرئيسية -->

        <a
            href="/"
            class="add-btn"
        >
            🏠 الصفحة الرئيسية
        </a>

    </div>


</body>

</html>
